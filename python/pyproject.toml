[project]
name = "live-translate-engine"
version = "1.0.0"
requires-python = ">=3.11"

# Runtime bagimliliklari requirements.txt yonetir; bu dosya arac ve kalite ayarlarini merkezlestirir.

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
extend-select = ["I", "UP"]
ignore = ["BLE001", "S110", "SIM102", "RUF013"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
