[project]
name = "live-translate-engine"
version = "1.0.0"
requires-python = ">=3.11"

# Runtime bagimliliklari requirements.txt yonetir; bu dosya arac ve kalite ayarlarini merkezlestirir.

[tool.pytest.ini_options]
# Mirrors the CI test matrix; test_engine.py needs ZMQ_AUTH_TOKEN + a live
# engine channel, so it stays out of the default run (run explicitly when
# needed). pysa/ is a vendored site-packages copy, never test code.
testpaths = [
    "test_engine_unit.py",
    "test_translation_terms.py",
    "test_azure_integration.py",
    "test_deepgram_buffering.py",
    "test_lts_server.py",
    "test_server_requirements.py",
]
norecursedirs = ["pysa", ".venv", ".pytest_cache", "__pycache__", "*.egg-info"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
extend-select = ["I", "UP"]
ignore = ["BLE001", "S110", "SIM102", "RUF013"]

[tool.ruff.lint.isort]
# Local modules — keeps import sorting consistent whether ruff is run from the
# repo root (as CI does) or from python/.
known-first-party = ["engine", "lts_server", "azure_translation_engine", "deepgram_engine"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
