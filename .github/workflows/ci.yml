name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint, Type Check & Test
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run typecheck

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          pip install pytest pytest-cov

      - name: Install runtime dependencies
        run: pip install -r python/requirements.txt

      - name: Run pytest suite
        working-directory: python
        run: |
          python -m pytest test_engine_unit.py test_translation_terms.py \
            test_azure_integration.py test_deepgram_buffering.py test_lts_server.py \
            --cov=engine --cov=azure_translation_engine --cov=deepgram_engine \
            --cov=lts_server \
            --cov-report=term-missing --cov-fail-under=35

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: NPM Audit (Critical & High only)
        run: npm audit --audit-level=high

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Python dependency audit
        run: |
          pip install pip-audit
          pip-audit -r python/requirements.txt

  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install lint tools
        run: pip install ruff

      - name: Run Ruff linter
        run: ruff check --config python/pyproject.toml python --output-format=github

      - name: Run Ruff formatter check
        run: ruff format --check --config python/pyproject.toml python

  ios-tests:
    name: iOS Tests
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Core Swift tests (headless)
        run: cd ios/Core && swift test

      - name: Generate Xcode project
        run: cd ios/App && xcodegen generate

      - name: Stub whisper xcframework (if real one absent)
        run: bash scripts/make-whisper-stub-xcframework.sh

      - name: App pipeline tests (simulator) against fake LTS
        run: |
          pip install -q websockets numpy
          # Real LTSServer + fake transcriber/translator/VAD for the Swift
          # LTSClient integration test (same wire protocol as production).
          python3 scripts/lts_fake_server.py --port 8765 > /tmp/lts-fake.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8765/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8765/health || { echo "fake LTS failed to start:"; cat /tmp/lts-fake.log; exit 1; }
          DEST=$(xcrun simctl list devices available -j | python3 -c \
            "import json,sys; d=json.load(sys.stdin); devs=[info['name'] for rt in d['devices'].values() for info in rt if info.get('isAvailable')]; print('platform=iOS Simulator,name=' + sorted(devs)[-1] if devs else '')")
          xcodebuild test -project ios/App/StealthSubtitleTranslator.xcodeproj \
            -scheme StealthSubtitleTranslator -destination "$DEST" \
            -derivedDataPath ios/App/DerivedData
