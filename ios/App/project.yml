# XcodeGen spec — generate the Xcode project with:
#   cd ios/App && xcodegen generate
#
# The app embeds the pure Swift core (LiveTranslateCore) as a local package,
# links the static whisper.xcframework built by scripts/build-whisper-ios-xcframework.sh,
# and embeds the SubtitleLiveActivity widget extension (Live Activity on the
# Lock Screen + Dynamic Island).
name: StealthSubtitleTranslator

options:
  bundleIdPrefix: com.stealth.subtitle
  deploymentTarget:
    iOS: "16.2"
  createIntermediateGroups: true

packages:
  LiveTranslateCore:
    path: ../Core

targets:
  StealthSubtitleTranslator:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - LiveActivityExtension
          - BroadcastExtension
      - path: Resources/Assets.xcassets
      - path: Resources/PrivacyInfo.xcprivacy
    dependencies:
      - package: LiveTranslateCore
        product: LiveTranslateCore
      - framework: ../Vendor/whisper.xcframework
        embed: false
      - sdk: CoreML.framework
      - sdk: Accelerate.framework
      - sdk: Metal.framework
      - target: SubtitleLiveActivity
      - target: BroadcastExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stealth.subtitle.translator.ios
        PRODUCT_NAME: "Stealth Subtitle Translator"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 79DZ4AA4DW
        CODE_SIGN_ENTITLEMENTS: Support/StealthTranslate.entitlements
        INFOPLIST_FILE: Support/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        # Live Activities + background capture keys live in Support/Info.plist
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        SWIFT_EMIT_LOC_STRINGS: YES

  BroadcastExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.2"
    sources:
      - path: Sources/BroadcastExtension
    dependencies:
      - package: LiveTranslateCore
        product: LiveTranslateCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stealth.subtitle.translator.ios.broadcast
        PRODUCT_NAME: "LiveTranslateBroadcast"
        INFOPLIST_FILE: Support/BroadcastExtension-Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/BroadcastExtension.entitlements
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 79DZ4AA4DW
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

  SubtitleLiveActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.2"
    sources:
      - path: Sources/LiveActivityExtension
      - path: Sources/LiveSubtitleAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stealth.subtitle.translator.ios.activity
        PRODUCT_NAME: "SubtitleLiveActivity"
        INFOPLIST_FILE: Support/SubtitleLiveActivity-Info.plist
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 79DZ4AA4DW
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SKIP_INSTALL: YES

  StealthSubtitleTranslatorTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.2"
    sources:
      - path: Tests
    dependencies:
      - target: StealthSubtitleTranslator
      - package: LiveTranslateCore
        product: LiveTranslateCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stealth.subtitle.translator.ios.tests
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        # PRODUCT_NAME contains spaces, so XcodeGen's automatic TEST_HOST
        # derivation (target-name based) is wrong — set it explicitly.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Stealth Subtitle Translator.app/Stealth Subtitle Translator"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  StealthSubtitleTranslator:
    build:
      targets:
        StealthSubtitleTranslator: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - StealthSubtitleTranslatorTests
      environmentVariables:
        # Integration tests connect to the fake LTS server (scripts/lts_fake_server.py).
        LTS_TEST_PORT: "8765"
