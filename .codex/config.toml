# Codex CLI — Project Configuration
# Ref: https://developers.openai.com/codex/config-basic

# Allow larger instruction files (AGENTS.md can be comprehensive)
project_doc_max_bytes = 65536

# Fallback filenames for instruction discovery
project_doc_fallback_filenames = ["AGENTS.md", ".agent/SYSTEM.md"]

# Multi-agent support (experimental)
[features]
multi_agent = true

# Agent roles
[agents.reviewer]
description = "Kod incelemesi, güvenlik ve test risk analizi"

[agents.explorer]
description = "Hızlı codebase keşfi (read-only)"
